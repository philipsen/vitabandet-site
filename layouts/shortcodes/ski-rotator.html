{{- $files := sort (readDir "static/img/ski") "Name" -}}
<div class="ski-rotator">
  <img src="/img/ski/{{ (index $files 0).Name }}" alt="Skiing in the mountains" width="1400" height="788">
  <script>
    (function () {
      var root = document.currentScript.parentNode;
      var img = root.querySelector("img");
      var names = [{{ range $i, $f := $files }}{{ if $i }},{{ end }}"{{ $f.Name }}"{{ end }}];
      if (names.length < 2) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var i = 0;
      var hold = 6000;
      var fade = 700;
      function url(n) { return "/img/ski/" + names[n]; }
      var ahead = new Image();
      ahead.src = url(1);
      setInterval(function () {
        img.style.opacity = "0";
        var next = (i + 1) % names.length;
        setTimeout(function () {
          i = next;
          img.src = url(i);
          img.style.opacity = "1";
          ahead = new Image();
          ahead.src = url((i + 1) % names.length);
        }, fade);
      }, hold + fade);
    })();
  </script>
</div>
<style>
  .ski-rotator {
    position: relative;
    width: 100%;
    aspect-ratio: 1400 / 788;
    margin: 1.25rem 0 1.5rem;
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .ski-rotator img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.7s ease;
  }
</style>
